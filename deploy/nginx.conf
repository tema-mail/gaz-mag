# Текущая выкладка – символическая ссылка /srv/current → /srv/<коммит>; переключение версии атомарное.
server {
  listen 8080;
  server_tokens off;
  absolute_redirect off;
  root /srv/current;
  index index.html;
  # Адреса как на Тильде – без слеша в конце: /montag отдаётся из /montag/index.html без переадресации.
  location / {
    try_files $uri $uri/index.html $uri.html @legacy;
  }
  # Промах: прежний адрес (Тильда, копия до ЧПУ) → приёмник отвечает 301 на новый адрес или отдаёт 404.html
  location @legacy {
    proxy_pass http://gaz-mag-api:8090/api/go?u=$uri;
    proxy_set_header Host $host;
  }
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /img/ {
    expires 30d;
  }
}
