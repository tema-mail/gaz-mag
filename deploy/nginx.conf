# Текущая выкладка – символическая ссылка /srv/current → /srv/<коммит>; переключение версии атомарное.
server {
  listen 8080;
  server_tokens off;
  absolute_redirect off;
  root /srv/current;
  index index.html;
  # Адреса как на Тильде – без слеша в конце: /montag отдаётся из /montag/index.html без переадресации.
  location / {
    try_files $uri $uri/index.html $uri.html =404;
  }
  location /_astro/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
  location /img/ {
    expires 30d;
  }
  error_page 404 /404.html;
}
