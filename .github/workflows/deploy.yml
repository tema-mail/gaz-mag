name: Код на сервер (боевой режим)

# gaz-mag.ru в бою с 18.10.2026: сайт собирается на сервере (gaz-mag-builder) из кода этого репозитория и данных
# сервера (товары и фото правит админка). Здесь – только задание серверу «забери новый код и пересобери».
# Ключ выкладки умеет лишь update / rollback / status (deploy/receive.sh) – файлы на сервер он не пишет.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-server
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Ключ выкладки
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          # отпечаток сервера заказчика (FirstVDS, с 02.11.2026) – открытые данные, не секрет
          DEPLOY_KNOWN_HOSTS: "62.109.0.63 ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHzGzZN9rSW/NYs9jSpisI7hMnc53NthT92UgS34rLIh"
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Задание серверу – забрать код и пересобрать
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes gazmag-deploy@62.109.0.63 "update ${GITHUB_SHA::12}"
      - name: Дождаться сборки на сервере
        run: |
          for i in $(seq 1 60); do
            sleep 10
            st=$(ssh -i ~/.ssh/deploy -o BatchMode=yes gazmag-deploy@62.109.0.63 status)
            echo "$st" | head -1
            echo "$st" | grep -q '"state":"done"' && echo "$st" | grep -q "${GITHUB_SHA::12}" && { echo "$st" | grep -q '"ok":true' && exit 0 || exit 1; }
          done
          echo "сервер не закончил сборку за 10 минут"; exit 1
