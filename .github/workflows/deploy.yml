name: Сборка и выкладка на Beget

# Код и история правок живут здесь, на сервере – только готовые файлы. Каждый пуш в main собирает сайт и
# выкладывает его на VPS Beget (gaz-mag.ru за общим Caddy). Ключ выкладки умеет только загрузить сборку,
# включить её и откатить (deploy/receive.sh на сервере); последние 5 выкладок хранятся для отката.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-beget
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Боевая сборка: свой домен, заявки включены (приёмник /api/lead на том же сервере), открыто для поиска.
      - run: npm run build
        env:
          PUBLIC_SITE_URL: https://gaz-mag.ru
          PUBLIC_LEADS: '1'
      - name: Ключ выкладки
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/deploy && chmod 600 ~/.ssh/deploy
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
      - name: Загрузить сборку (только изменённые файлы)
        run: rsync -a --delete --link-dest=/releases/current -e "ssh -i ~/.ssh/deploy -o BatchMode=yes" dist/ gazmag-deploy@45.12.72.227:incoming/
      - name: Включить выкладку
        run: ssh -i ~/.ssh/deploy -o BatchMode=yes gazmag-deploy@45.12.72.227 "activate ${GITHUB_SHA::12}"
